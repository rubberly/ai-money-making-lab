# Render Blueprint: deploys both prototypes as free web services.
# Login: REQUIRE_LOGIN "false" makes the workspaces public (no login). Set it to "true" to require
# APP_USERNAME + APP_PASSWORD again (APP_PASSWORD is in each service's Environment tab;
# Render generates the password). The /offer pages are always public.
# Free instances sleep when idle and do NOT keep data across restarts/redeploys.
services:
  - type: web
    name: repurpose-desk
    runtime: node
    plan: free
    rootDir: prototypes/repurpose-desk
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_LOGIN
        value: "false"
      - key: APP_USERNAME
        value: lucas
      - key: APP_PASSWORD
        generateValue: true

  - type: web
    name: site-makeover-kit
    runtime: node
    plan: free
    rootDir: prototypes/site-makeover-kit
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_LOGIN
        value: "false"
      - key: APP_USERNAME
        value: lucas
      - key: APP_PASSWORD
        generateValue: true
