# Render Blueprint: deploys both prototypes as free web services.
# The workspace of each app is password-protected (APP_PASSWORD, generated by Render;
# find it under the service's Environment tab). The /offer page stays public.
# Free instances sleep when idle and do NOT keep data across restarts/redeploys.
services:
  - type: web
    name: repurpose-desk
    runtime: node
    plan: free
    rootDir: prototypes/repurpose-desk
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD
        generateValue: true

  - type: web
    name: site-makeover-kit
    runtime: node
    plan: free
    rootDir: prototypes/site-makeover-kit
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD
        generateValue: true
